<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prueba privada — Top 5 Latino</title><style>
*{box-sizing:border-box}body{margin:0;background:#100718;color:white;font:16px Arial,sans-serif}main{max-width:950px;margin:30px auto;padding:20px}h1{color:#e886ff}p{color:#d7b8e6}button{border:1px solid #e74df5;color:white;background:#652080;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:bold}button:disabled{opacity:.55}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.box{padding:20px;border:2px solid #db35ed;border-radius:17px;box-shadow:0 0 20px #d832e455}.song{display:grid;grid-template-columns:40px 1fr 130px;align-items:center;gap:12px;border:1px solid #7d378f;border-radius:9px;margin:9px 0;padding:12px}.song b{color:#ffcf78;font-size:25px}.song small{display:block;color:#d6b6e4}.bar{background:#41304c;height:11px;border-radius:9px;margin:7px 0}.fill{height:100%;background:#c72ce8;border-radius:9px;transition:width .3s}.badge{background:#291034;padding:12px;border-radius:9px;margin-top:14px}#result{color:#ffdc77;font-weight:bold}a{color:#f59df9}@media(max-width:500px){.song{grid-template-columns:26px 1fr 75px;gap:7px}.song button{padding:8px 5px}}</style></head><body><main>
<h1>Top 5 Latino — Prueba de cambio semanal</h1><p>Esta página de pruebas no altera la página oficial ni los votos del público. Los votos aquí son simulados, apenas para verificar el cambio automático de títulos y barras.</p>
<div class="actions"><button id="week1">Semana 1</button><button id="week2">Simular semana 2: tres canciones nuevas</button></div>
<div class="box"><h2>♡ Votación del público</h2><p id="edition"></p><div id="songs"></div><div class="badge" id="result">Sin votos</div></div>
<p><a href="/">Volver a VelvetVerse Radio</a></p>
</main><script>
const week1=[['6796864754','BbY WOW','KAROL G, Judeline y rusowsky'],['1787023936','DtMF','Bad Bunny'],['6796864746','Ahí','KAROL G y Drake'],['1877482633','KOKO','Omar Courtz'],['1880109891','Ayúdame','Los Dos de Tamaulipas']];
const week2=[['1787023936','DtMF','Bad Bunny'],['test-new-1','Canción nueva A','Artista nuevo A'],['6796864746','Ahí','KAROL G y Drake'],['test-new-2','Canción nueva B','Artista nuevo B'],['test-new-3','Canción nueva C','Artista nuevo C']];
let round=1,counts={};
const el=document.getElementById('songs'),msg=document.getElementById('result');
function render(){const songs=round===1?week1:week2;document.getElementById('edition').textContent='Edición de prueba: semana '+round;el.replaceChildren();songs.forEach((s,i)=>{const n=counts[s[0]]||0,total=Object.values(counts).reduce((a,b)=>a+b,0),p=total?Math.round(100*n/total):0;const row=document.createElement('div');row.className='song';const rank=document.createElement('b');rank.textContent=i+1;const info=document.createElement('div');const title=document.createElement('strong');title.textContent=s[1];const artist=document.createElement('small');artist.textContent=s[2];const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=p+'%';bar.append(fill);const pct=document.createElement('small');pct.textContent=n+' votos · '+p+'%';info.append(title,artist,bar,pct);const b=document.createElement('button');b.textContent='♡ Votar';b.onclick=()=>{counts[s[0]]=(counts[s[0]]||0)+1;render()};row.append(rank,info,b);el.append(row)});const ranking=songs.map(x=>({s:x,n:counts[x[0]]||0})).sort((a,b)=>b.n-a.n);msg.textContent=ranking[0].n?'Favorita del público: '+ranking[0].s[1]+' ('+ranking[0].n+' votos)':'Aún no hay votos en esta semana';}
document.getElementById('week1').onclick=()=>{round=1;counts={};render()};document.getElementById('week2').onclick=()=>{round=2;counts={};render()};render();
</script></body></html>
