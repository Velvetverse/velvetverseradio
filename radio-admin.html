<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Central de Administração — VelvetVerse Radio</title><style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark;background:#100a1a;color:#f9f2ff}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1170px;margin:auto}header{padding:25px 0;border-bottom:1px solid #583073;margin-bottom:24px}h1{font-size:clamp(25px,4vw,39px);margin:8px 0}h2{margin:8px 0 16px}a{color:#edb9ff}.muted{color:#bcaacb}button,input,select{font:inherit;border-radius:9px;padding:11px}button{background:#992dbe;border:0;color:white;cursor:pointer}button.secondary{background:#403051}input,select{background:#21152f;border:1px solid #694982;color:white;max-width:100%}.panel{background:#1d132b;border:1px solid #52336a;border-radius:15px;padding:20px;margin:16px 0}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button.active{background:#bd4ce6}.hidden{display:none!important}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}@media(max-width:700px){.cards{grid-template-columns:1fr}}.card{background:#2a1b3b;border-radius:10px;padding:20px}.metric{font-size:32px;font-weight:750}.line{border-top:1px solid #513568;padding:12px 0;overflow-wrap:anywhere}.line:first-child{border-top:0}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 24px}.error{color:#ff9f9f}.good{color:#a6ffc4}label{display:block;margin-bottom:5px}#message{margin-top:15px}a.cardlink{display:inline-block;padding:12px 16px;background:#57316f;border-radius:8px;text-decoration:none}small{color:#c8b6d1}</style></head><body><main>
<header><small>VELVETVERSE RADIO · ACESSO PRIVADO</small><h1>Central de Administração</h1><p class="muted">Open Stage · Discos Pedidos · Top 5 Latino</p></header>
<section class="panel" id="login"><h2>Entrar</h2><form id="form"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Palavra-passe</label><input id="password" type="password" required autocomplete="current-password"><p><button>Entrar</button></p></form><small>Usa a mesma conta de administrador do Open Stage.</small></section>
<section id="private" class="hidden"><div class="tabs"><button data-tab="overview" class="active">Visão geral</button><button data-tab="stage">🎤 Open Stage</button><button data-tab="requests">💿 Discos Pedidos</button><button data-tab="top5">🏆 Top 5 Latino</button><button id="refresh" class="secondary">Atualizar</button><button id="logout" class="secondary">Sair</button></div><div id="section" class="panel"></div></section><p id="message" role="status" aria-live="polite"></p>
</main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const base='https://bxndpplrxplszhaxules.supabase.co',key='sb_publishable_5yb8Ij6FevaAk9r3IOrmYQ_BYs_5Aou',client=createClient(base,key),$=id=>document.getElementById(id);let data=null,tab='overview',query='',edition='',sunday='';
const node=(tag,value,cls)=>{const el=document.createElement(tag);el.textContent=value??'';if(cls)el.className=cls;return el};
function msg(value,error=false){$('message').textContent=value;$('message').className=error?'error':'good'}
function line(parent,...parts){const el=node('div','','line');parts.forEach(x=>el.append(x));parent.append(el);return el}
function p(v){return node('p',v)}function detail(label,value){const el=node('span');el.append(node('strong',label+': '),document.createTextNode(value??'—'));return el}
const date=v=>v?new Date(v).toLocaleString('pt-PT'):'—';
function render(){if(!data)return;const section=$('section');section.replaceChildren();
if(tab==='overview'){section.append(node('h2','Resumo da Rádio'));const cards=node('div','','cards');for(const [name,count] of [['Candidaturas Open Stage',data.stage.length],['Pedidos de músicas (últimos até 1000)',data.requests.length],['Votos Top 5 (edições carregadas)',data.top5.reduce((sum,x)=>sum+x.total,0)]]){const c=node('div','','card');c.append(node('div',count,'metric'),node('div',name));cards.append(c)}section.append(cards,p('O painel consulta dados existentes e não altera o funcionamento das páginas públicas.'));return;}
if(tab==='stage'){section.append(node('h2','Open Stage — Novos Talentos'));const a=node('a','Abrir painel de avaliação','cardlink');a.href='open-stage-admin.html';section.append(a,p(data.stage.length+' candidatura(s) guardada(s).'));for(const x of data.stage)line(section,detail('Artista',x.artist_name),document.createTextNode(' · '),detail('Música',x.music_title),document.createTextNode(' · '),detail('Estado',x.status));return;}
if(tab==='requests'){section.append(node('h2','Discos Pedidos'));const filters=node('div','','filters');const search=node('input');search.placeholder='Pesquisar ouvinte, artista, música, cidade...';search.value=query;search.oninput=()=>{query=search.value;render()};const select=node('select');const dates=[...new Set(data.requests.map(x=>x.target_sunday))].sort().reverse();for(const d of ['Todas as datas',...dates]){const op=node('option',d);op.value=d==='Todas as datas'?'':d;select.append(op)}select.value=sunday;select.onchange=()=>{sunday=select.value;render()};filters.append(search,select);section.append(filters);const q=query.toLocaleLowerCase();const matching=data.requests.filter(x=>(!sunday||x.target_sunday===sunday)&&[x.listener_name,x.artist,x.song,x.city,x.country,x.dedication].some(v=>(v||'').toLocaleLowerCase().includes(q)));section.append(p(matching.length+' pedido(s) encontrados'));for(const x of matching){const row=line(section,detail('Domingo',x.target_sunday),document.createTextNode(' · '),detail('Ouvinte',x.listener_name));row.append(p([x.city,x.country].filter(Boolean).join(', ')),p(x.artist+' — '+x.song),p('Dedicatória: '+(x.dedication||'Sem dedicatória')),p('Estado: '+x.status+' · Enviado: '+date(x.created_at)))}return;}
section.append(node('h2','Top 5 Latino'));section.append(p('Votos agrupados por edição. Dados de consulta, sem alterar a votação.'));const picker=node('select');for(const e of data.top5){const op=node('option',e.edition+' · '+e.total+' votos');op.value=e.edition;picker.append(op)}if(!edition||!data.top5.some(x=>x.edition===edition))edition=data.top5[0]?.edition||'';picker.value=edition;picker.onchange=()=>{edition=picker.value;render()};section.append(picker);const chosen=data.top5.find(x=>x.edition===edition);if(!chosen){section.append(p('Ainda sem votos.'));return}section.append(p('Total de votos: '+chosen.total));for(const x of chosen.songs)line(section,detail('Identificador Apple Music',x.song_id),document.createTextNode(' · '+x.votes+' votos · '+(chosen.total?Math.round(x.votes*100/chosen.total):0)+'%'));}
async function load(){msg('A carregar...');try{const {data:{session}}=await client.auth.getSession();if(!session)throw Error('Sessão terminada.');const response=await fetch(base+'/functions/v1/velvetverse-admin-overview',{headers:{Authorization:'Bearer '+session.access_token,apikey:key}});const payload=await response.json();if(!response.ok)throw Error(payload.error||'Não foi possível consultar os dados.');data=payload;render();msg('Dados atualizados.')}catch(e){msg(e.message,true);}}
async function show(){const {data:{session}}=await client.auth.getSession();$('login').classList.toggle('hidden',!!session);$('private').classList.toggle('hidden',!session);if(session)await load();}
$('form').onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message,true);await show()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('refresh').onclick=load;$('logout').onclick=async()=>{await client.auth.signOut();data=null;msg('Sessão terminada.');await show()};
await show();
</script></body></html>
