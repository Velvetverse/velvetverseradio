<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VelvetVerse Radio App</title>

  <style>
    body {
      margin: 0;
      background: #07070b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .topbar{position:sticky;top:0;z-index:10;background:#0d0916;border-bottom:1px solid #6b2b91;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 22px;flex-wrap:wrap}
    .topbrand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-weight:800;letter-spacing:.5px}
    .topbrand img{width:42px;height:42px;object-fit:cover;border-radius:50%;border:1px solid #bd55fc}
    .topbrand b{color:#d65cff}
    .topnav{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center}
    .topnav a{color:#fff;border:1px solid #5e3279;border-radius:8px;padding:9px 12px;text-decoration:none;font-size:13px;font-weight:700}
    .topnav a:hover{border-color:#c05cff;background:#30113e}
    .mini-radio{display:flex;gap:9px;align-items:center;justify-content:center;background:#1d102a;border:1px solid #9d44da;border-radius:999px;padding:7px 12px;color:#fff}
    .mini-radio button{border:0;border-radius:50%;width:32px;height:32px;background:#a744e8;color:#fff;cursor:pointer;font-size:16px}
    .mini-radio span{font-size:12px}
    .install-icon{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:#24202d;border:1px solid #9350d7;border-radius:8px;vertical-align:middle;flex-shrink:0}
    .install-icon svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .steps{list-style:none;padding:0;margin:12px 0;display:grid;gap:12px;text-align:left}
    .steps li{display:flex;align-items:center;gap:12px;padding:10px 13px;background:#1d1429;border:1px solid #50316d;border-radius:12px}
    .steps p{margin:0;line-height:1.5}
    .steps small{color:#c9b5df;display:block}
    .small-note{font-size:13px;color:#c8b7d7;line-height:1.5}
    @media(max-width:740px){.topbar{justify-content:center;padding:10px}.topnav{gap:5px}.topnav a{font-size:11px;padding:7px}.mini-radio{width:100%}}
    .wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #d8b4ff;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .app-button {
      display: inline-block;
      margin: 20px 0;
      padding: 14px 28px;
      border: 2px solid #b24cff;
      border-radius: 28px;
      background: linear-gradient(90deg,#7c3cff,#e600a9);
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 0 18px rgba(178,76,255,.7);
    }

    @media(min-width:651px){.app-button{display:none}}
    .qr-note{font-size:13px;color:#c9b8d9;margin-top:8px}
    .qr-wrap{display:flex;flex-direction:column;align-items:center}
    @media(max-width:650px){.desktop-qr{display:none!important}.wrap{padding:28px 16px}.box{padding:18px}.subtitle{font-size:16px}}
    .guide-gallery{display:grid;gap:24px;margin:28px auto;max-width:1400px}
    .guide-figure{margin:0;padding:0;border:1px solid #8b38cf;border-radius:16px;overflow:hidden;background:#100a19}
    .guide-figure img{display:block;width:100%;height:auto}
    .box {
      margin-top: 30px;
      padding: 25px;
      border: 1px solid #7c3cff;
      border-radius: 18px;
      background: #111119;
    }

    .instructions {
      text-align: left;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #d8b4ff;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="topbrand" href="/"><img src="/logo.png" alt="VelvetVerse Radio"><span>VelvetVerse <b>RADIO</b></span></a>
    <nav class="topnav" aria-label="Navegação">
      <a href="/">Home</a><a href="/#schedule">Schedule</a><a href="/#top5latino">Top 5 Latino</a><a href="/#gallery">Gallery</a><a href="/#about">About</a><a href="/#contact">Contact</a><a href="/#comments">Comments</a><a href="/#podcasts">Podcasts</a><a href="/#requests">Discos Pedidos</a>
    </nav>
    <div class="mini-radio"><button id="miniToggle" type="button" aria-label="Ouvir rádio">▶</button><span id="miniStatus">◉ LISTEN LIVE</span></div>
  </header>
  <audio id="miniStream" preload="none" src="https://stream.rcast.net/73595"></audio>
  <div class="wrap">

    <h1>VelvetVerse Radio</h1>

    <div class="subtitle">
      Instala a aplicação da VelvetVerse Radio — Android e iPhone
    </div>

  <div style="
  display:flex;
  align-items:center;
  justify-content:center;
  gap:24px;
  flex-wrap:wrap;
  margin:20px 0;
">

  <a class="app-button" href="/radio-app/index.html">
    📲 CONTINUAR PARA INSTALAÇÃO
  </a>

  <div class="qr-wrap desktop-qr"><img
    src="velvetverse-radio-app-qr.png"
    alt="QR Code VelvetVerse Radio App"
    style="
      width:164px;
      height:164px;
      border-radius:12px;
      background:white;
      padding:8px;
      box-shadow:0 0 18px rgba(178,76,255,.45);
    "
  ><div class="qr-note">Lê o QR code com o telemóvel</div></div>

</div>

    <section class="guide-gallery" aria-label="Guias de instalação da aplicação">
      <figure class="guide-figure">
        <img src="../Android.png" alt="Guia visual passo a passo para instalar a VelvetVerse Radio no Android, em português e inglês" loading="lazy">
      </figure>
      <figure class="guide-figure">
        <img src="../IPhone.png" alt="Guia visual passo a passo para instalar a VelvetVerse Radio no iPhone, em português e inglês" loading="lazy">
      </figure>
    </section>

    <a class="back" href="/">
      ← Voltar à VelvetVerse Radio
    </a>

  </div>

<script>
  const miniStream=document.getElementById('miniStream'),miniToggle=document.getElementById('miniToggle'),miniStatus=document.getElementById('miniStatus');
  miniToggle.addEventListener('click',async()=>{
    if(!miniStream.paused){miniStream.pause();return}
    miniStatus.textContent='A ligar / Connecting…';
    miniStream.src='https://stream.rcast.net/73595?live='+Date.now();
    try{await miniStream.play()}catch(e){miniStatus.textContent='Não foi possível ligar / Unable to play'}
  });
  miniStream.addEventListener('playing',()=>{miniToggle.textContent='❚❚';miniStatus.textContent='◉ LIVE'});
  miniStream.addEventListener('pause',()=>{miniToggle.textContent='▶';miniStatus.textContent='◉ LISTEN LIVE'});
</script></body>
</html>
