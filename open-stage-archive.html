<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Arquivo de Artistas e Músicas — VelvetVerse Radio</title>
<style>:root{font:16px system-ui,Arial,sans-serif;color-scheme:dark;background:#100a1a;color:#f8f3ff}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1130px;margin:auto}a{color:#ecbeff}.muted{color:#c2b3d0}header{border-bottom:1px solid #553267;padding-bottom:18px;margin-bottom:20px}h1{margin:.4em 0;font-size:clamp(26px,4vw,38px)}.panel,.artist{background:#1f1530;border:1px solid #50376a;border-radius:14px;padding:18px;margin:14px 0}.artist{background:#261b36}input,select,textarea,button{font:inherit;border-radius:8px;padding:10px}input,select,textarea{background:#140e23;border:1px solid #74568c;color:white;width:100%}button{background:#9b30c4;color:white;border:0;cursor:pointer}button.secondary{background:#473451}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{display:block;font-size:14px;margin:8px 0;color:#eadcf7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.track{border-top:1px solid #563967;padding:13px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.hidden{display:none!important}.good{color:#a2ffc1}.error{color:#ffadb6}small{color:#c7b9d5}#message{min-height:22px}summary{cursor:pointer;font-weight:700}strong{color:white}</style></head><body><main><header><small>VELVETVERSE RADIO · ÁREA PRIVADA</small><h1>🎤 Arquivo de Artistas e Músicas</h1><p class="muted">Uma ficha por artista · várias músicas e respetivo histórico · pesquisa rápida</p><a href="radio-admin.html">← Voltar à Central de Administração</a></header>
<section id="login" class="panel"><h2>Entrar</h2><form id="auth-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Palavra-passe<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section>
<section id="private" class="hidden"><div class="panel"><div class="row"><h2>Artistas</h2><div class="actions"><button id="refresh" class="secondary">Atualizar</button><button id="logout" class="secondary">Sair</button></div></div><input id="search" placeholder="Pesquisar artista, música, email ou país…" aria-label="Pesquisar arquivo"><p id="summary" class="muted"></p></div>
<details class="panel" id="new-artist"><summary>+ Adicionar artista recebido por email</summary><form id="artist-form"><div class="grid"><label>Nome artístico *<input name="name" required maxlength="180"></label><label>Email do artista<input name="email" type="email" maxlength="254"></label><label>País<input name="country" maxlength="100"></label><label>Notas internas<input name="notes" maxlength="2000"></label></div><button type="submit">Guardar artista</button></form></details>
<div id="artists"></div></section><p id="message" role="status" aria-live="polite"></p></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const base='https://bxndpplrxplszhaxules.supabase.co',key='sb_publishable_5yb8Ij6FevaAk9r3IOrmYQ_BYs_5Aou',client=createClient(base,key);
const $=id=>document.getElementById(id);let artists=[],tracks=[];
const make=(tag,txt='',cls='')=>{const el=document.createElement(tag);el.textContent=txt;if(cls)el.className=cls;return el};
const notify=(txt,bad=false)=>{$('message').textContent=txt;$('message').className=bad?'error':'good'};
async function api(method='GET',body){const {data:{session}}=await client.auth.getSession();if(!session)throw Error('Sessão expirada. Entra novamente.');const resp=await fetch(base+'/functions/v1/open-stage-archive',{method,headers:{Authorization:'Bearer '+session.access_token,apikey:key,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const result=await resp.json().catch(()=>({}));if(!resp.ok)throw Error(result.error||'Erro '+resp.status);return result}
async function refresh(){notify('A carregar arquivo…');try{const result=await api();artists=result.artists;tracks=result.tracks;render();notify('Arquivo atualizado.')}catch(e){notify(e.message,true)}}
function field(name,label,value='',type='text',extra={}){const wrap=make('label',label),input=document.createElement(type==='textarea'?'textarea':'input');input.name=name;if(type!=='textarea')input.type=type;input.value=value??'';if(extra.required)input.required=true;if(extra.maxLength)input.maxLength=extra.maxLength;wrap.append(input);return wrap}
function selectField(name,label,value,values){const wrap=make('label',label),sel=document.createElement('select');sel.name=name;for(const [v,t] of values){const opt=document.createElement('option');opt.value=v;opt.textContent=t;sel.append(opt)}sel.value=value;wrap.append(sel);return wrap}
const statuses=[['pending','Pendente'],['awaiting_mp3','Aguardar MP3'],['in_review','Em avaliação'],['approved','Aprovada'],['aired','Já transmitida'],['rejected','Não selecionada']];
function values(form){return Object.fromEntries(new FormData(form).entries())}
function buildTrackForm(track,artistId){const form=make('form','','panel');const grid=make('div','','grid');grid.append(field('title','Título da música *',track?.title||'','text',{required:true,maxLength:200}),field('genre','Género musical',track?.genre||''),selectField('status','Estado da música',track?.status||'pending',statuses),field('received_at','Data de receção',track?.received_at||'','date'),field('broadcast_date','Data de emissão',track?.broadcast_date||'','date'),field('music_url','Link da música (opcional)',track?.music_url||'','url'));const rotation=make('label');const check=document.createElement('input');check.type='checkbox';check.name='in_rotation';check.style.width='auto';check.checked=track?.in_rotation===true;rotation.append(check,document.createTextNode(' Música na rotação normal da rádio'));grid.append(rotation,field('notes','Notas internas (edição, contactos, localização do MP3)',track?.notes||'','textarea'));form.append(grid);const save=make('button',track?'Guardar alterações':'Adicionar música');save.type='submit';form.append(save);form.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{const data=values(form);data.in_rotation=check.checked;data.action=track?'update_track':'add_track';if(track)data.id=track.id;else data.artist_id=artistId;await api('POST',data);await refresh();notify(track?'Música atualizada.':'Nova música adicionada.')}catch(e){notify(e.message,true)}finally{save.disabled=false}};return form}
function render(){const q=$('search').value.trim().toLocaleLowerCase();const items=artists.filter(a=>[a.name,a.email,a.country,...tracks.filter(t=>t.artist_id===a.id).map(t=>t.title)].some(v=>String(v||'').toLocaleLowerCase().includes(q)));$('summary').textContent=artists.length+' artistas · '+tracks.length+' músicas';const list=$('artists');list.replaceChildren();if(!items.length){list.append(make('p','Nenhum artista encontrado.'));return}for(const a of items){const card=make('section','','artist');const head=make('div','','row');const title=make('h2',a.name);head.append(title,make('small',(a.country||'País não indicado')+' · '+(a.email||'Sem email')));card.append(head);const artistSongs=tracks.filter(t=>t.artist_id===a.id);card.append(make('p',artistSongs.length+' música(s) registada(s)','muted'));const details=document.createElement('details');const sum=make('summary','Ver ficha do artista e músicas');details.append(sum);const profile=document.createElement('details');profile.append(make('summary','Editar ficha do artista'));const pf=make('form','','panel');const pg=make('div','','grid');pg.append(field('name','Nome artístico',a.name,'text',{required:true}),field('email','Email',a.email||'','email'),field('country','País',a.country||''),field('notes','Notas internas',a.notes||'','textarea'));pf.append(pg);const pb=make('button','Guardar ficha');pf.append(pb);pf.onsubmit=async e=>{e.preventDefault();pb.disabled=true;try{await api('POST',{action:'update_artist',id:a.id,...values(pf)});await refresh();notify('Ficha do artista atualizada.')}catch(e){notify(e.message,true)}finally{pb.disabled=false}};profile.append(pf);details.append(profile);
for(const t of artistSongs){const block=make('div','','track');const info=make('div','','row');const name=make('strong',t.title);const state=make('small',statuses.find(v=>v[0]===t.status)?.[1]||t.status);info.append(name,state);block.append(info);block.append(make('small',(t.broadcast_date?'Emissão: '+t.broadcast_date:'Emissão não marcada')+(t.in_rotation?' · Em rotação':'')+(t.submission_id?' · Candidatura do site':'')));const edit=document.createElement('details');edit.append(make('summary','Editar música'),buildTrackForm(t,a.id));block.append(edit);details.append(block)}
const add=document.createElement('details');add.append(make('summary','+ Adicionar outra música deste artista'),buildTrackForm(null,a.id));details.append(add);card.append(details);list.append(card)}}
$('search').addEventListener('input',render);
$('artist-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;const button=form.querySelector('button');button.disabled=true;try{await api('POST',{action:'add_artist',...values(form)});form.reset();$('new-artist').open=false;await refresh();notify('Artista criado. Abre a ficha e adiciona a música.')}catch(err){notify(err.message,true)}finally{button.disabled=false}};
$('refresh').onclick=refresh;
$('logout').onclick=async()=>{await client.auth.signOut();artists=[];tracks=[];$('artists').replaceChildren();await present();notify('Sessão terminada.')};
$('auth-form').onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return notify(error.message,true);await present()};
async function present(){const {data:{session}}=await client.auth.getSession();$('login').classList.toggle('hidden',!!session);$('private').classList.toggle('hidden',!session);if(session)await refresh()}
await present();
</script></body></html>
