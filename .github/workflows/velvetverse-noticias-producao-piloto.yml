name: VelvetVerse Noticias - piloto de redacao e audio (manual)
on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "Etapa segura: verificar_sem_custos, rascunho_ia, audio_aprovado ou teste de voz"
        required: true
        default: verificar_sem_custos
        type: choice
        options:
          - verificar_sem_custos
          - rascunho_ia
          - audio_aprovado
          - teste_custo_voz_gratis
      enviar_para_r2:
        description: 'Apenas guardar MP3 aprovado em R2 PRIVADO (não ligar RadioDJ)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: noticias-piloto
  cancel-in-progress: false
jobs:
  piloto:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.VV_OPENAI_MODEL }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      FISH_VOICE_REFERENCE_ID: ${{ secrets.FISH_VOICE_REFERENCE_ID }}
      FISH_TTS_MODEL: ${{ vars.VV_FISH_MODEL }}
      VV_APPROVED_SCRIPT: noticias-aprovado.json
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar configuracao da API sem chamadas pagas
        if: ${{ inputs.etapa == 'verificar_sem_custos' }}
        run: |
          python - <<'PY'
          import os
          for key in ('OPENAI_API_KEY','OPENAI_MODEL','FISH_AUDIO_API_KEY','FISH_VOICE_REFERENCE_ID'):
              print(key+': '+('CONFIGURADO' if os.environ.get(key) else 'EM FALTA'))
          print('PRE-FLIGHT SEM CHAMADAS A OPENAI OU FISH AUDIO; CUSTO API = USD 0.00')
          PY
      - name: Instalar FFmpeg para montagem do audio
        if: ${{ inputs.etapa == 'teste_custo_voz_gratis' || inputs.etapa == 'audio_aprovado' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Ensaiar um noticiario longo com Fish Audio gratis (sem RadioDJ)
        if: ${{ inputs.etapa == 'teste_custo_voz_gratis' }}
        env:
          VV_ONLY_ESTIMATE: 'false'
        run: python scripts/velvetverse_noticias_teste_custo.py
      - name: Pesquisa e meteorologia
        run: python scripts/velvetverse_noticias_pesquisa.py
      - name: Auditar títulos
        run: python scripts/velvetverse_noticias_auditoria.py
      - name: Produzir rascunho IA pesquisado (consome API apenas se selecionado)
        if: ${{ inputs.etapa == 'rascunho_ia' }}
        run: python scripts/velvetverse_noticias_producao.py draft
      - name: Gerar caderno de revisão editorial (sem aprovação)
        if: ${{ inputs.etapa == 'rascunho_ia' }}
        run: python scripts/velvetverse_noticias_revisao.py
      - name: Confirmar existencia de guiao previamente aprovado
        if: ${{ inputs.etapa == 'audio_aprovado' }}
        run: |
          test -f "$VV_APPROVED_SCRIPT" || { echo "::error::Não existe noticias-aprovado.json revisto. Não gerar áudio."; exit 1; }
          python scripts/velvetverse_noticias_producao.py validate
      - name: Gerar MP3 de ensaio privado (consome Fish API)
        if: ${{ inputs.etapa == 'audio_aprovado' }}
        run: python scripts/velvetverse_noticias_producao.py render
      - name: Preparar dependência boto3 (apenas se upload privado foi pedido)
        if: ${{ inputs.etapa == 'audio_aprovado' && inputs.enviar_para_r2 }}
        run: python -m pip install boto3
      - name: Enviar áudio aprovado para R2 privado (SEM RadioDJ)
        if: ${{ inputs.etapa == 'audio_aprovado' && inputs.enviar_para_r2 }}
        run: |
          python scripts/velvetverse_noticias_transferencia.py upload --file "$(find noticias-teste -maxdepth 1 -name 'velvetverse-noticias-*-ENSAIO.mp3' -print -quit)"
      - name: Guardar resultados de ensaio por 1 dia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-piloto-privado
          path: |
            noticias-teste/custo-voz.json
            noticias-teste/texto-teste-voz.txt
            noticias-teste/*NAO-EMITIR.mp3
            noticias-teste/rascunho-ia.json
            noticias-teste/caderno-revisao.md
            noticias-teste/consumo-redacao.json
            noticias-teste/auditoria.md
            noticias-teste/*-ENSAIO.mp3
          retention-days: 1
          if-no-files-found: ignore
