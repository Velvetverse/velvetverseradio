name: VelvetVerse Noticias - pesquisa experimental (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recolher metadados RSS e previsoes (sem emissao)
        run: python scripts/velvetverse_noticias_pesquisa.py
      - name: Criar guiao PT-PT de ensaio (incompleto, nao emitir)
        run: python scripts/velvetverse_noticias_guiao_teste.py
      - name: Validar rascunho e bloquear guiao incompleto
        run: python scripts/velvetverse_noticias_validar.py
      - name: Mostrar guiao nos registos (sem ficheiros para descarregar)
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("noticias-teste/guiao-ensaio.md")
          print("===== GUIAO EXPERIMENTAL: NAO EMITIR =====")
          print(p.read_text(encoding="utf-8")[:18000])
          print("===== FIM DO GUIAO =====")
          PY
      - name: Guardar ficheiros de teste privados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velvetverse-noticias-pesquisa-teste
          path: noticias-teste/
          retention-days: 3
          if-no-files-found: warn
