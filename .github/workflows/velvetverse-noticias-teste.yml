name: VelvetVerse Noticias - pesquisa experimental (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recolher metadados RSS e previsoes (sem emissao)
        run: python scripts/velvetverse_noticias_pesquisa.py
      - name: Guardar ficheiros de teste privados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velvetverse-noticias-pesquisa-teste
          path: noticias-teste/
          retention-days: 3
          if-no-files-found: warn
