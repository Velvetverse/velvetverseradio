name: Atualizar Top 5 Latino — Shazam
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12,16,20 * * *'
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ler Shazam CSV e verificar Top 5 nos leitores Apple Music
        run: python scripts/test_shazam_top5.py --publish
      - name: Publicar a edição apenas se mudou
        run: |
          if ! git diff --quiet -- top5-weekly.json; then
            git config user.name "velvetverse-bot"
            git config user.email "actions@users.noreply.github.com"
            git add top5-weekly.json
            git commit -m "Top 5 Latino — Shazam atualizado"
            git push
          else
            echo "Edição já atual"
          fi
