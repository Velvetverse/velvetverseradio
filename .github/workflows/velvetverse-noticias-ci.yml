name: VelvetVerse Noticias - verificar codigo (sem APIs)
on:
  push:
    paths:
      - 'scripts/velvetverse_noticias_*.py'
      - '.github/workflows/velvetverse-noticias-ci.yml'
      - 'tests/test_noticias_selecao.py'
      - 'tests/test_noticias_preflight_editorial.py'
      - 'tests/test_noticias_transferencia_offline.py'
      - 'tests/test_noticias_autorizacao.py'
      - '.github/workflows/velvetverse-noticias-producao-piloto.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe de todos os scripts
        run: python -m compileall -q scripts/velvetverse_noticias_*.py
      - name: Testar selecao automatica de noticias com dados locais
        run: python tests/test_noticias_selecao.py
      - name: Testar bloqueio antes de despesas com IA
        run: python tests/test_noticias_preflight_editorial.py
      - name: Testar transporte R2 e integridade sem Internet
        run: python tests/test_noticias_transferencia_offline.py
      - name: Bloquear chamadas pagas sem autorizacao, mesmo fora do GitHub
        run: python tests/test_noticias_autorizacao.py
      - name: Confirmar bloqueios de despesa e emissao
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/velvetverse_noticias_producao.py').read_text(encoding='utf-8')
          w=Path('.github/workflows/velvetverse-noticias-producao-piloto.yml').read_text(encoding='utf-8')
          assert 'if not key or not model:' in p
          assert 'autorizar_chamadas_pagas' in w
          assert 'inputs.modelo_redacao' in w
          print('OK: custo bloqueado sem modelo e autorizacao.')
          PY
      - name: Verificar as tres vinhetas reais sem chamadas pagas
        run: python scripts/velvetverse_noticias_preflight.py --json noticias-teste/preflight.json
      - name: Garantir que um rascunho nunca e aprovado automaticamente
        run: |
          python - <<'PY'
          from scripts.velvetverse_noticias_producao import validate
          try:
              validate({"estado":"RASCUNHO","edicao":"2026-11-08"})
          except ValueError:
              print("OK: rascunho BLOQUEADO")
          else:
              raise SystemExit("ERRO: rascunho não foi bloqueado")
          PY
      - name: Testar estimativa de custos do jornal longo sem chamar APIs
        run: |
          VV_ONLY_ESTIMATE=true python scripts/velvetverse_noticias_teste_custo.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("noticias-teste/custo-voz.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["segmentos"] == 15
          assert d["palavras"] > 1500
          assert d["custo_fish_s21_pro_free_usd"] == 0.0
          print("OK: estimativa offline sem gerar voz ou despesa.")
          PY
      - name: Testar ordem das vinhetas e limite de palavras sem gastar APIs
        run: |
          python - <<'PY'
          import copy
          from scripts.velvetverse_noticias_producao import SECTIONS, validate, target_date
          base={
              "edicao":target_date(),"estado":"APROVADO_POR_EDITOR",
              "aprovado_por":"editor-teste","aprovado_em":"TESTE-LOCAL",
              "abertura":"Boa tarde. Notícias, com Ricky Sousa.",
              "fecho":"Obrigado por acompanhar o noticiário.",
              "secoes":{}
          }
          counts={"internacional":2,"portugal":2,"desporto_canada":1,
                  "futebol_portugal":3,"meteorologia_canada":1,"meteorologia_portugal":3}
          sentence=("Esta frase é apenas texto fictício para testar o código "
                    "de montagem, não representa uma notícia verdadeira. ")
          for name in SECTIONS:
              base["secoes"][name]=[{
                  "texto":sentence*14,"fontes":["https://example.org/"],
                  "confirmado":True} for _ in range(counts[name])]
          assert len(" ".join(x["texto"] for sec in base["secoes"].values() for x in sec).split())>=2400
          seq=validate(base)
          assert seq[0]=="__VV_ABERTURA__"
          assert seq.index("__VV_DESPORTO__")<seq.index(base["secoes"]["desporto_canada"][0]["texto"])
          assert seq.index("__VV_METEOROLOGIA__")<seq.index(base["secoes"]["meteorologia_canada"][0]["texto"])
          short=copy.deepcopy(base)
          for sec in short["secoes"].values():
              for item in sec:item["texto"]=sentence
          try:
              validate(short)
          except ValueError:
              pass
          else:
              raise AssertionError("Guião curto indevidamente aceite")
          print("PASS: ordem de vinhetas, duração mínima, sem chamadas externas.")
          PY
