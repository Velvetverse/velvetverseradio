name: VelvetVerse Noticias - pesquisa automatica semanal (sem IA paga)
on:
  schedule:
    - cron: '15 12 * * 0'
    - cron: '15 13 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recolha:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Confirmar domingo 08h15 Toronto (horario de verao/inverno)
        id: hora
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          local=datetime.now(ZoneInfo('America/Toronto'))
          allowed=(local.weekday()==6 and local.hour==8)
          print('executar='+str(allowed or os.environ['EVENT']=='workflow_dispatch').lower())
          print('Hora Toronto:',local.isoformat(),file=__import__('sys').stderr)
          PY
      - uses: actions/checkout@v4
        if: steps.hora.outputs.executar == 'true'
      - uses: actions/setup-python@v5
        if: steps.hora.outputs.executar == 'true'
        with:
          python-version: '3.12'
      - name: Pesquisar fontes e meteorologia sem chamar OpenAI nem Fish
        if: steps.hora.outputs.executar == 'true'
        run: python scripts/velvetverse_noticias_pesquisa.py
      - name: Auditar frescura, duplicados e qualidade de candidatos
        if: steps.hora.outputs.executar == 'true'
        run: python scripts/velvetverse_noticias_auditoria.py
      - name: Guardar pesquisa para consulta (nunca emitir)
        if: steps.hora.outputs.executar == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: noticias-pesquisa-semanal-NAO-EMITIR
          path: |
            noticias-teste/pesquisa.json
            noticias-teste/pesquisa.md
            noticias-teste/auditoria.json
            noticias-teste/auditoria.md
          retention-days: 7
          if-no-files-found: error
