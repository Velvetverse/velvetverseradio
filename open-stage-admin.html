<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Open Stage — Administração | VelvetVerse Radio</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif;background:#100b1b;color:#f8f4ff}
*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1100px;margin:auto}h1{font-size:clamp(1.5rem,4vw,2.25rem);margin:8px 0}small,.muted{color:#b9abc7}header{border-bottom:1px solid #4b285f;padding-bottom:24px;margin-bottom:24px}a{color:#dfbaff}.panel,.entry{background:#1e1430;border:1px solid #503166;border-radius:14px;padding:22px;margin:16px 0}input,textarea,select{width:100%;background:#2d2040;border:1px solid #6b4c80;border-radius:8px;padding:12px;color:white;font:inherit;margin:7px 0 15px}label{font-weight:600}button{font:inherit;cursor:pointer;border:0;border-radius:8px;color:white;background:#a218cf;padding:12px 18px}button:disabled{opacity:.55;cursor:wait}.secondary{background:#493259}.actions{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none!important}img{max-width:260px;max-height:260px;object-fit:contain;border-radius:9px;background:#110d19}.grid{display:grid;grid-template-columns: minmax(200px,280px) 1fr;gap:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}}.detail{overflow-wrap:anywhere}.detail p{line-height:1.5}.error{color:#ffadaf}.good{color:#8ef0bf}#message{min-height:24px}strong{color:#fff}
</style></head><body><main>
<header><small>VELVETVERSE RADIO · ÁREA PRIVADA</small><h1>Open Stage — Novos Talentos</h1><div class="muted">Gestão interna de candidaturas. Esta página não publica artistas.</div></header>
<section id="login" class="panel"><h2>Entrar</h2><form id="loginform"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Palavra-passe<input id="password" type="password" required autocomplete="current-password"></label><div class="actions"><button type="submit">Entrar</button><button type="button" id="signup" class="secondary">Criar conta (primeira utilização)</button></div></form><p class="muted">A criação de conta não dá acesso automático às candidaturas. É necessária autorização de administrador.</p></section>
<section id="dashboard" class="hidden"><div class="actions"><button id="refresh">Atualizar candidaturas</button><button class="secondary" id="logout">Sair</button></div><p class="muted" id="counter"></p><div id="entries"></div></section>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const base='https://bxndpplrxplszhaxules.supabase.co';
const key='sb_publishable_5yb8Ij6FevaAk9r3IOrmYQ_BYs_5Aou';
const supabase=createClient(base,key);
const $=id=>document.getElementById(id);
function message(s,bad=false){$('message').textContent=s;$('message').className=bad?'error':'good'}
function text(tag,value,cls=''){const e=document.createElement(tag);e.textContent=value??'—';if(cls)e.className=cls;return e;}
async function request(method,body){const {data:{session}}=await supabase.auth.getSession();if(!session)throw Error('Sessão expirada. Entra novamente.');const resp=await fetch(base+'/functions/v1/open-stage-admin',{method,headers:{'Authorization':'Bearer '+session.access_token,'apikey':key,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const out=await resp.json().catch(()=>({}));if(!resp.ok)throw Error(out.error||'Erro ao consultar candidaturas ('+resp.status+')');return out;}
async function load(){message('A carregar candidaturas...');try{const {records}=await request('GET');$('entries').replaceChildren();$('counter').textContent=records.length+' candidatura(s)';for(const item of records){const card=text('article','','entry');const grid=text('div','','grid');const pic=document.createElement('div');if(item.photo_url){const img=document.createElement('img');img.src=item.photo_url;img.alt='Fotografia enviada por '+item.artist_name;img.referrerPolicy='no-referrer';pic.append(img)}else pic.append(text('p','Sem fotografia disponível'));const detail=text('div','','detail');detail.append(text('h2',item.artist_name),text('p','Música: '+(item.music_title||'—')),text('p','País: '+(item.country||'—')),text('p','Género: '+(item.genre||'—')),text('p','Email: '+(item.email||'—')),text('p','Descrição: '+(item.artist_bio||'—')),text('p','Tipo de música: '+(item.song_type||'—')),text('p','Autores: '+(item.original_songwriters||'—')),text('p','Uso de IA: '+(item.ai_category||'—')+(item.ai_tool?' · '+item.ai_tool:'')),text('p','Direitos confirmados: '+(item.rights_confirmed?'Sim':'Não')),text('p','Recebida: '+new Date(item.created_at).toLocaleString('pt-PT')),text('p','Referência: '+item.id));if(item.music_url){const a=document.createElement('a');a.href=item.music_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Abrir ligação da música';detail.append(a)}const label=text('label','Estado');const select=document.createElement('select');for(const [value,title] of [['pending','Pendente'],['approved','Aprovada'],['rejected','Rejeitada']]){const opt=document.createElement('option');opt.value=value;opt.textContent=title;select.append(opt)}select.value=item.status;const notes=text('label','Notas internas');const textarea=document.createElement('textarea');textarea.rows=3;textarea.maxLength=2000;textarea.value=item.review_notes||'';const button=text('button','Guardar avaliação');button.onclick=async()=>{button.disabled=true;try{await request('POST',{id:item.id,status:select.value,review_notes:textarea.value});message('Avaliação guardada: '+item.artist_name)}catch(e){message(e.message,true)}finally{button.disabled=false}};detail.append(label,select,notes,textarea,button);grid.append(pic,detail);card.append(grid);$('entries').append(card)}message('Candidaturas carregadas. As fotografias têm acesso temporário.')}catch(e){message(e.message,true)}}
async function present(){const {data:{session}}=await supabase.auth.getSession();$('login').classList.toggle('hidden',!!session);$('dashboard').classList.toggle('hidden',!session);if(session)await load();}
$('loginform').onsubmit=async e=>{e.preventDefault();message('A autenticar...');const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return message(error.message,true);await present()};
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return message('Introduz um email e uma palavra-passe.',true);const {error}=await supabase.auth.signUp({email,password});message(error?error.message:'Conta solicitada. Confirma o email se receberes uma mensagem. Ainda é necessária autorização de administrador.',!!error)};
$('refresh').onclick=load;
$('logout').onclick=async()=>{await supabase.auth.signOut();$('entries').replaceChildren();message('Sessão terminada.');await present()};
await present();
</script></body></html>
